# Codex config for this project. Codex loads it only when the project is
# trusted. See AGENTS.md, "Inteligência de código (LSP)".

# TypeScript language server, reached through an LSP-to-MCP bridge.
# Both binaries come pinned from devbox.json, so start Codex from the
# repository root inside the devbox environment.
[mcp_servers.typescript]
command = "mcp-language-server"
args = ["--workspace", ".", "--lsp", "typescript-language-server", "--", "--stdio"]
# tsserver takes a while to start on the Windows drive under WSL.
startup_timeout_sec = 30
# Read-only: Codex edits files itself, with its own approvals.
enabled_tools = ["definition", "references", "hover", "diagnostics"]
