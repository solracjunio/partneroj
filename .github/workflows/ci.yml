name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # No version here: it reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Keep in sync with devbox.json (nodejs@26).
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Build first: packages export ./dist/*.d.ts, and type-aware lint
      # and tsc in the apps resolve workspace imports through them.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      # The summary script's own tests.
      - run: pnpm test:scripts

      # Every package's tests in one run, measuring coverage: the same
      # tests as `pnpm test`, with the report the summary reads.
      - run: pnpm coverage

      # Mutation testing of the domain (Stryker): every surviving mutant
      # fails the run ("break": 100 in stryker.config.json). A survivor
      # gets a test, or a "Stryker disable" comment with its reason.
      - run: pnpm --filter @partneroj/domain mutation

      # Each function's cyclomatic complexity, for the summary. It only
      # measures: no limit, it never fails the run.
      - run: pnpm complexity

      # Coverage, mutation and complexity as tables on the run's Summary
      # page. Also
      # after a failure, which it reports (survivors by file and line); a
      # report a failed step never wrote shows as missing.
      - name: Coverage and mutation summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/quality-summary.mjs >> "$GITHUB_STEP_SUMMARY"
