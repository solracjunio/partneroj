name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # No version here: it reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Keep in sync with devbox.json (nodejs@26).
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Build first: packages export ./dist/*.d.ts, and type-aware lint
      # and tsc in the apps resolve workspace imports through them.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
