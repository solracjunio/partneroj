# Production stack on the VPS. Deployed by infra/production/deploy.sh;
# see docs/operacao.md. Secrets come from .env next to this file (never in
# git; start from .env.example).
#
# Only Caddy publishes ports to the internet: Docker-published ports
# bypass ufw. Uptime Kuma publishes on 127.0.0.1 only, for an SSH tunnel;
# everything else is reachable only inside this network.
name: partneroj

x-app: &app
  build:
    context: ../..
    dockerfile: infra/production/Dockerfile
    target: app
  image: partneroj-app:latest
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    &app-env # The restricted login (packages/db/src/prepare.ts), never the owner.
    DATABASE_URL: postgres://partneroj_api:${APP_DB_PASSWORD:?}@postgres:5432/partneroj
    # The site's address, for the invite links printed by admin-cli.
    PUBLIC_URL: https://${DOMAIN:?}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # The owner of the tables. Only the migrate step connects as it.
      POSTGRES_USER: partneroj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: partneroj
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partneroj -d partneroj"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once per deploy, then exits: migrations, app login, pg-boss.
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "packages/db/dist/prepare-cli.js"]
    environment:
      OWNER_DATABASE_URL: postgres://partneroj:${POSTGRES_PASSWORD:?}@postgres:5432/partneroj
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]
    environment:
      <<: *app-env
      # Web Push: the browser subscribes with the public key. The API never
      # gets the private one, so it cannot sign a push.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      <<: *app-env
      # The worker sends the pushes (jobs.ts), so only it signs them.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?}
      VAPID_SUBJECT: https://partneroj.com.br

  caddy:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  # Not started by `up` (profile): run by the systemd timers and deploy.sh,
  #   docker compose -f infra/production/compose.yml run --rm backup [script]
  backup:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      target: backup
    image: partneroj-backup:latest
    profiles: [tools]
    command: ["backup.sh"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The dump and the throwaway Postgres of restore-check.sh live here.
    tmpfs:
      - /tmp:size=1g,uid=70,gid=70
    environment:
      PGHOST: postgres
      PGUSER: partneroj
      PGDATABASE: partneroj
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      RESTIC_REPOSITORY: /restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      RESTIC_CACHE_DIR: /tmp/restic-cache
      # Push monitors of Uptime Kuma; empty until they are created.
      BACKUP_PUSH_URL: ${BACKUP_PUSH_URL:-}
      RESTORE_CHECK_PUSH_URL: ${RESTORE_CHECK_PUSH_URL:-}
      # The home PC's rest-server, through WireGuard (copy-offsite.sh).
      OFFSITE_HOST: 10.77.0.2:8000
      OFFSITE_PASSWORD: ${OFFSITE_PASSWORD:-}
      OFFSITE_PUSH_URL: ${OFFSITE_PUSH_URL:-}
    volumes:
      # A host directory, not a volume: `docker compose down -v` removes
      # volumes, and must never take the backups along with the database.
      - ${BACKUP_DIR:?}:/restic
    depends_on:
      postgres:
        condition: service_healthy

  # Alerts on the phone through ntfy (docs/operacao.md). The panel is
  # published on the server's loopback only: reach it through an SSH
  # tunnel, never from the internet.
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  uptime-kuma-data:
  postgres-data:
  caddy-data:
  caddy-config:
