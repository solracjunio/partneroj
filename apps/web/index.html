<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Plan section 6: invite links are sent by messengers, whose link
      preview reads this static page. It has no names, so the preview
      shows only the app's name. Nothing is for search engines.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- An invite link carries its token: never send the URL elsewhere. -->
    <meta name="referrer" content="no-referrer" />
    <meta property="og:title" content="Partneroj" />
    <meta property="og:description" content="Gestão para sócios" />
    <title>Partneroj</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
